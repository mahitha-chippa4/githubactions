
name: Python CI Pipeline

# Trigger workflow on push and pull requests to main
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# Repository permissions
permissions:
  contents: read

jobs:

  # Job 1: Test using multiple Python versions
  test:
    name: Test on Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:

      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python and enable caching
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run unit tests
      - name: Run tests
        run: pytest -v

  # Job 2: Display pipeline summary
  report:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Display pipeline result
        run: |
          echo "CI Pipeline Completed"
          echo "Test Job Result: ${{ needs.test.result }}"
